<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>MeuBotFacebook</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,Segoe UI,sans-serif;background:#eef2f7;color:#172033}
.phone{max-width:430px;min-height:100vh;margin:auto;background:#fff}.top{padding:22px 20px 18px;background:#1877f2;color:#fff}
h1{font-size:24px;margin:0 0 4px}.sub{opacity:.9;font-size:13px}
main{padding:18px}.step{display:flex;gap:8px;margin-bottom:18px}.step span{padding:7px 11px;border-radius:20px;background:#e8eef8;font-size:12px}.step .on{background:#1877f2;color:#fff}
label{display:block;font-weight:650;font-size:14px;margin:14px 0 7px}input,textarea{width:100%;border:1px solid #ccd5e2;border-radius:10px;padding:12px;font:inherit}textarea{min-height:130px;resize:vertical}
.attach{border:2px dashed #b9c6d8;border-radius:12px;padding:18px;text-align:center}.attach input{border:0;padding:8px 0}
.preview{margin-top:16px;border:1px solid #dce3ed;border-radius:12px;overflow:hidden}.preview .head{padding:12px;font-weight:700}.preview .body{padding:0 12px 14px;white-space:pre-wrap}.actions{display:flex;gap:10px;margin-top:18px}button{flex:1;border:0;border-radius:10px;padding:13px;font-weight:700;font-size:14px}button.primary{background:#1877f2;color:#fff}button.secondary{background:#e8eef8;color:#172033}
</style>
</head>
<body><div class="phone">
<header class="top"><h1>MeuBotFacebook</h1><div class="sub">Criador de anúncios · Modo teste</div></header>
<main>
<div class="step"><span class="on">1 Criar</span><span>2 Grupos</span><span>3 Publicar</span></div>
<label for="title">Título do anúncio</label><input id="title" placeholder="Ex.: Sabadão do Forró">
<label for="text">Texto da publicação</label><textarea id="text" placeholder="Escreva o anúncio aqui..."></textarea>
<label>Anexar imagem ou arquivos</label><div class="attach">Selecione os arquivos<input id="files" type="file" multiple accept="image/*,.pdf,.doc,.docx,.txt"></div>
<div id="preview" class="preview"><div class="head">Prévia do anúncio</div><div class="body">Preencha o título e o texto para visualizar.</div></div>
<div class="actions"><button class="secondary" onclick="preview()">Ver prévia</button><button class="primary" onclick="saveAd()">Salvar anúncio</button></div>
</main></div>
<script>
const title=document.getElementById('title'), text=document.getElementById('text'), files=document.getElementById('files');
function preview(){document.querySelector('#preview .head').textContent=title.value||'Prévia do anúncio';document.querySelector('#preview .body').textContent=text.value||'Preencha o texto para visualizar.'}
function saveAd(){localStorage.setItem('meubotfacebook-anuncio',JSON.stringify({title:title.value,text:text.value}));alert('Anúncio salvo neste navegador.')}
files.addEventListener('change',()=>{document.querySelector('.attach').firstChild.textContent=files.files.length+' arquivo(s) selecionado(s)';});
</script></body></html>
